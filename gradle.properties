# 设置 Gradle 命令的默认内存。可由用户或命令行参数覆盖。
# 这是为 Minecraft 反编译过程提供足够内存所必需的。
# 附加：本机访问 maven.minecraftforge.net 很慢，ForgeGradle 启动时的“服务器连通性自检”会卡住构建，
#       这里关掉该自检（只影响联网检查，不影响下载/编译）。
org.gradle.jvmargs=-Xmx3G -Dnet.minecraftforge.gradle.check.certs=false
org.gradle.daemon=false


## 环境属性

# Minecraft 版本必须与 Forge 版本匹配，才能获得有效的构建产物。
minecraft_version=1.20.1
# Minecraft 版本范围可以使用任何 Minecraft 正式版本作为边界。
# 快照版、预发布版和候选发布版不保证能正确排序，
# 因为它们不遵循标准的版本命名规范。
minecraft_version_range=[1.20.1,1.21)
# Forge 版本必须与 Minecraft 版本匹配，才能获得有效的构建产物。
forge_version=47.3.0
# Forge 版本范围可以使用任何 Forge 版本作为边界，或者匹配加载器版本范围。
forge_version_range=[47,)
# 加载器版本范围只能使用 Forge/FML 的主版本号作为边界。
loader_version_range=[47,)
# 使用的映射表（mappings）渠道。
# 默认支持的映射渠道有 ["official", "snapshot", "snapshot_nodoc", "stable", "stable_nodoc"]。
# 可以通过 Gradle 插件中的 "channelProviders" 扩展来注册额外的映射渠道。
#
# | 渠道      | 版本                  |                                                                                |
# |-----------|----------------------|--------------------------------------------------------------------------------|
# | official  | MCVersion            | 来自 Mojang 映射文件的官方字段/方法名称                                        |
# | parchment | YYYY.MM.DD-MCVersion | 基于官方映射之上的、由社区贡献的参数名称和 Javadoc 层                          |
#
# 在使用 'official' 或 'parchment' 映射时，你必须了解 Mojang 的许可证条款。
# 更多信息请参见：https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
#
# Parchment 是由 ParchmentMC 维护的非官方项目，独立于 Minecraft Forge。
# 使用他们的映射需要额外配置，请参见 https://parchmentmc.org/docs/getting-started
mapping_channel=official
# 从映射渠道查询的映射版本。
# 这必须符合映射渠道所要求的格式。
mapping_version=1.20.1


## 模组属性

# 模组的唯一标识符。必须为英文小写，且符合正则表达式 [a-z][a-z0-9_]{1,63}。

# 必须与标注了 @Mod 注解的主模组类中定义的字符串常量一致。
mod_id=sbwcontrol
# 模组的人类可读显示名称。
mod_name=SBW Controls
# 模组的许可证。在 https://choosealicense.com/ 上查看你的选项。默认值为 All Rights Reserved。
mod_license=GPL-3.0
# 模组版本。遵循语义化版本规范 https://semver.org/lang/zh-CN/
mod_version=1.0.0
# 模组的 group ID。仅在将构建产物发布到 Maven 仓库时才有意义。
# 应与模组源码使用的基础包名一致。
# 参见 https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.sakasiyhaha.sbwcontrol
# 模组作者。这是一个简单的文本字符串，用于在模组列表中显示。
mod_authors=sakasiyhaha
# 模组描述。这是一个简单的多行文本字符串，用于在模组列表中显示。
# 注意：gradle.properties 按 ISO-8859-1 读取，此处请勿使用中文，否则 mods.toml 会出现乱码。
mod_description=Flight control scheme & dynamic third-person aiming camera addon for Superb Warfare. Switchable yaw-bird / roll-bird / hybrid control styles, fully configurable via key bindings, in-game config screen and config files.

org.gradle.java.home=D:/DevTools/Java/JDK17/jdk-17.0.18+8